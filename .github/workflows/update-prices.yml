name: Update WoW KR Auction Prices

on:
  # 직접 실행 버튼
  workflow_dispatch:

  # 약 5분마다 자동 실행
  schedule:
    - cron: "2/5 * * * *"

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 이전 배포가 아직 진행 중이면 새 배포를 우선
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  # ========================================
  # 1. TUE 가격 가져오기 + Pages 파일 생성
  # ========================================
  build:
    runs-on: ubuntu-latest

    steps:

      # 저장소 파일 가져오기
      - name: Checkout
        uses: actions/checkout@v6

      # Python 설치
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # update.py 실행
      - name: Get TUE KR prices
        env:
          TUE_API_KEY: ${{ secrets.TUE_API_KEY }}
        run: python update.py

      # GitHub Pages 설정
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # update.py가 만든 _site 폴더 업로드
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site


  # ========================================
  # 2. GitHub Pages 실제 배포
  # ========================================
  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
